<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Línea de tiempo · Aprendizaje por refuerzo · Carlos David Garzón Rodríguez</title>
  <style>
    :root {
      --bg: #070b14;
      --accent: #8fd0ff;
      --text: #e7eefc;
      --muted: #93a4c2;
      --card: rgba(8, 12, 22, 0.82);
      --line: rgba(232, 240, 255, 0.12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    button { font-family: inherit; color: inherit; }
    canvas { display: block; }
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 42%, rgba(4, 7, 14, 0.5) 100%);
    }
    #progress {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      z-index: 5;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.04);
    }
    #progress-bar {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.45s ease;
    }
    #card {
      position: fixed;
      z-index: 3;
      top: 18px;
      left: 18px;
      width: min(390px, calc(100vw - 36px));
      max-height: calc(100vh - 132px);
      overflow: auto;
      padding: 16px 16px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
    }
    #card::-webkit-scrollbar { width: 8px; }
    #card::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 99px; }
    #home, .ghost, #chips button, #nav button, #prev, #next, #close-light {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
    }
    #home {
      padding: 5px 10px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    #author {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.35;
    }
    #author strong {
      color: var(--text);
      font-weight: 650;
    }
    #home:hover, .ghost:hover, #chips button:hover, #nav button:hover, #prev:hover, #next:hover {
      border-color: rgba(255,255,255,0.28);
    }
    #era {
      margin: 12px 0 0;
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 8px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: -0.02em;
    }
    #years { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    #diagram-name { margin: 12px 0 0; font-size: 15px; font-weight: 650; }
    #copy { margin: 8px 0 0; color: #d5e1f4; font-size: 14.5px; line-height: 1.48; }
    #copy em { font-style: normal; color: white; }
    #chips { display: flex; gap: 8px; margin-top: 12px; }
    #chips button {
      flex: 1;
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 12px;
    }
    #chips button.on, #nav button.on {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.06);
    }
    #actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .ghost { padding: 7px 12px; font-size: 13px; border-radius: 999px; }
    #note, #keys { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    #dock {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 20px);
    }
    #prev, #next {
      width: 40px;
      height: 40px;
      font-size: 22px;
      line-height: 1;
    }
    #nav {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      backdrop-filter: blur(16px);
    }
    #nav button {
      min-width: 118px;
      padding: 8px 10px;
      text-align: left;
      border-radius: 12px;
    }
    #nav .yrs { display: block; font-size: 12px; font-weight: 700; }
    #nav .nm { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    #nav .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border-radius: 99px;
      background: var(--c);
      box-shadow: 0 0 8px var(--c);
    }
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(4, 6, 12, 0.84);
    }
    #lightbox[hidden] { display: none; }
    #lightbox figure { margin: 0; max-width: min(1080px, 94vw); }
    #lightbox img {
      display: block;
      width: 100%;
      max-height: 76vh;
      object-fit: contain;
      border-radius: 12px;
      background: #111;
    }
    #lightbox figcaption { margin-top: 8px; color: #d5e0f2; font-size: 13px; }
    #close-light { margin-top: 8px; padding: 6px 12px; }
    #boot-error {
      position: fixed;
      z-index: 7;
      left: 16px;
      bottom: 16px;
      max-width: min(520px, calc(100vw - 32px));
      margin: 0;
      color: #ffb4b4;
      background: rgba(40, 8, 8, 0.9);
      padding: 10px 12px;
      border-radius: 10px;
    }
    @media (max-width: 860px) {
      #card { top: auto; bottom: 92px; max-height: 30vh; }
      #nav button { min-width: 92px; }
      #nav .nm { display: none; }
    }
  </style>
</head>
<body>
  <div id="progress"><span id="progress-bar"></span></div>
  <div id="vignette"></div>
  <section id="card">
    <button id="home" type="button">Vista general</button>
    <p id="author">Trabajo presentado por <strong>Carlos David Garzón Rodríguez</strong></p>
    <p id="era"></p>
    <h1 id="title"></h1>
    <p id="years"></p>
    <p id="diagram-name"></p>
    <p id="copy"></p>
    <div id="chips"></div>
    <div id="actions">
      <button id="fig" class="ghost" type="button" hidden>Ver figura de referencia</button>
      <button id="auto" class="ghost" type="button">Presentar</button>
    </div>
    <p id="note">Las animaciones son esquemas didácticos de cada idea. Las curvas, los porcentajes y el radar no son mediciones de un experimento.</p>
    <p id="keys">Rueda o flechas · clic en un diagrama · Esc inicio · P presentar</p>
  </section>
  <div id="dock">
    <button id="prev" type="button" aria-label="Estación anterior">‹</button>
    <nav id="nav">
      <button type="button" data-hito="0"><span class="dot" style="--c:#3ec8ff"></span><span class="yrs">1980s–1990s</span><span class="nm">RL clásico</span></button>
      <button type="button" data-hito="1"><span class="dot" style="--c:#c49bff"></span><span class="yrs">2013–2017</span><span class="nm">Deep RL</span></button>
      <button type="button" data-hito="2"><span class="dot" style="--c:#ffb020"></span><span class="yrs">2018–2024</span><span class="nm">Sim-to-real</span></button>
      <button type="button" data-hito="3"><span class="dot" style="--c:#5ce1ff"></span><span class="yrs">2025–2026</span><span class="nm">Multi-agente</span></button>
    </nav>
    <button id="next" type="button" aria-label="Estación siguiente">›</button>
  </div>
  <div id="lightbox" hidden>
    <figure>
      <img id="light-img" alt="Figura de referencia" />
      <figcaption id="light-cap"></figcaption>
      <button id="close-light" type="button">Cerrar</button>
    </figure>
  </div>
  <p id="boot-error" hidden></p>
  <script src="three.min.js"></script>
  <script src="linea-de-tiempo-rl.js"></script>
</body>
</html>
